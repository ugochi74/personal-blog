
{% extends "base.html" %}

{% block title %}{{ title }} | My Personal Blog{% endblock %}

{% block content %}

<article class="full-article">

    <a href="{{ url_for('home') }}">← Back to Home</a>

    <h1>{{ title }}</h1>

    <div class="article-meta-row">
        <div class="article-meta-details">
            <p class="article-category">{{ category }}</p>
            <p class="article-date">Published: {{ date }}</p>
        </div>
        <a class="download-pdf-button" href="{{ url_for('download_article_pdf', slug=slug) }}">
            <span aria-hidden="true">↓</span> Download PDF
        </a>
    </div>

    <div class="article-content">
        {{ content | safe }}
    </div>

</article>

{% endblock %}
