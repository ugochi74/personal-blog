
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Personal Blog{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Articles about Christian growth, software engineering, books, and personal development.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="My Personal Blog">
    <meta property="og:title" content="{% block og_title %}My Personal Blog{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Ideas and lessons on faith, engineering, books, and personal development.{% endblock %}">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">

    <header>
        <nav>
            <a href="{{ url_for('home') }}">My Personal Blog</a>
            <a href="{{ url_for('home') }}">Home</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 My Personal Blog. All rights reserved.</p>
        <a class="admin-login-link" href="{{ url_for('login') }}">Admin Login</a>
    </footer>

</body>
</html>
